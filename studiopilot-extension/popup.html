<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; background: #16161c; color: #e8e8ee;
         font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; display: inline-block; }
  .sub { color: #9a9ab0; font-size: 11px; margin-bottom: 10px; }
  #status { background: #101015; border: 1px solid #34343f; border-radius: 8px;
            padding: 8px; margin-bottom: 10px; font-size: 12px; color: #b9b9cc; }
  a.btn { display: block; text-align: center; text-decoration: none; background: #23232c;
          color: #e8e8ee; border: 1px solid #3a3a48; border-radius: 8px;
          padding: 8px; margin-bottom: 6px; font-weight: 600; }
  a.btn:hover { background: #2c2c38; }
  .foot { font-size: 11px; color: #777; margin-top: 8px; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> StudioPilot</h1>
  <div class="sub">AI agent for Roblox Studio</div>
  <div id="status">Checking the bridge…</div>
  <a class="btn" href="https://claude.ai/new" target="_blank">Claude</a>
  <a class="btn" href="https://chatgpt.com/" target="_blank">ChatGPT</a>
  <a class="btn" href="https://arena.ai/agent" target="_blank">Arena (Agent)</a>
  <div class="foot">Open one of the chats above, describe your task in the StudioPilot bar and press <b>Iniciar sessão</b>.</div>
<script src="popup.js"></script>
</body>
</html>
